name: Build ChessScreenAssistant APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessScreenAssistant-Android-Source.zip'
      - '.github/workflows/main.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip ChessScreenAssistant-Android-Source.zip -d source
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: source/chessscreen-assistant
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessScreenAssistant-APK
          path: source/chessscreen-assistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
